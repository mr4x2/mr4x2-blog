name: Sync reading

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-reading
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s scripts

      - name: Sync from Raindrop
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          RAINDROP_COLLECTION_ID: ${{ secrets.RAINDROP_COLLECTION_ID }}
        run: python3 scripts/sync_raindrop.py

      - name: Commit
        id: commit
        run: 'scripts/commit_data.sh data/reading.json "chore(reading): sync from Raindrop"'

      - name: Deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push made with GITHUB_TOKEN doesn't trigger other workflows, but a dispatch does.
        run: gh workflow run hugo.yml --ref main
