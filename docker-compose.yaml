networks:
  traefik_cloudflare:
    external: true
services:
  hugo-blog:
    image: mr4x2/hugo-blog:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hugo-blog.entrypoints=websecure"
      - "traefik.http.routers.hugo-blog.rule=Host(`mr4x2.com`)"
      - "traefik.http.routers.hugo-blog.service=hugo-blog"
      - "traefik.http.services.hugo-blog.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_cloudflare"
      - "traefik.http.routers.hugo-blog.tls=true"
      - "traefik.http.routers.hugo-blog.tls.certresolver=production"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - traefik_cloudflare

  # Pulls a new :latest every 5 minutes and recreates hugo-blog.
  # Only containers with the enable label above are touched.
  # nickfedor/watchtower is the maintained fork; containrrr/watchtower is archived.
  watchtower:
    image: nickfedor/watchtower:1.24.1
    command: --label-enable --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
