{{ with .Paginator }}
  {{ if gt .TotalPages 1 }}
    <nav class="pager" aria-label="Pages">
      {{ if .HasPrev }}<a href="{{ .Prev.URL }}" rel="prev">newer</a>{{ end }}
      <span>{{ .PageNumber }} of {{ .TotalPages }}</span>
      {{ if .HasNext }}<a href="{{ .Next.URL }}" rel="next">older</a>{{ end }}
    </nav>
  {{ end }}
{{ end }}
