<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="/" aria-label="{{ site.Title }}"
      ><span class="logo-user">{{ site.Params.username }}@blog</span>:~$<span
        class="logo-cursor"
        aria-hidden="true"
      ></span
    ></a>

    <nav class="menu" aria-label="Main">
      {{ range site.Menus.main }}
        <a
          class="menu-link"
          href="{{ .URL }}"
          {{ if or (hasPrefix .URL "http://") (hasPrefix .URL "https://") }}
            target="_blank" rel="noopener noreferrer"
          {{ end }}
          >{{ .Name }}</a
        >
      {{ end }}
    </nav>

    <div class="actions">
      <button
        type="button"
        class="btn needs-js"
        data-search-open
        aria-label="Search posts"
      >
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <span>Search</span>
        <kbd data-search-hint>⌘K</kbd>
      </button>
      <button
        type="button"
        class="btn tg needs-js"
        data-theme-toggle
        aria-label="Switch theme"
      >
        <svg
          class="icon tg-icon tg-sun"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
        <svg
          class="icon tg-icon tg-moon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <svg
          class="icon tg-icon tg-flower"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1"
          />
          <circle cx="12" cy="8" r="2" />
          <path d="M12 10v12" />
          <path d="M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5Z" />
          <path d="M12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z" />
        </svg>
      </button>
    </div>
  </div>
  {{ if and .IsPage (not .Layout) }}
    <div class="read-progress" aria-hidden="true"></div>
  {{ end }}
</header>
