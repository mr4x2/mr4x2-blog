<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="/" aria-label="{{ site.Title }}"
      ><span class="logo-user">{{ site.Params.username }}@blog</span>:~$<span
        class="logo-cursor"
        aria-hidden="true"
      ></span
    ></a>

    <nav class="menu" aria-label="Main">
      {{ range site.Menus.main }}
        <a
          class="menu-link"
          href="{{ .URL }}"
          {{ if or (hasPrefix .URL "http://") (hasPrefix .URL "https://") }}
            target="_blank" rel="noopener noreferrer"
          {{ end }}
          >{{ .Name }}</a
        >
      {{ end }}
    </nav>

    <div class="actions">
      <button
        type="button"
        class="btn needs-js"
        data-search-open
        aria-label="Search posts"
      >
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <span>Search</span>
        <kbd data-search-hint>⌘K</kbd>
      </button>
      <button
        type="button"
        class="btn tg needs-js"
        data-theme-toggle
        aria-label="Toggle dark mode"
      >
        <svg
          class="icon tg-icon tg-sun"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
        <svg
          class="icon tg-icon tg-moon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>
    </div>
  </div>
</header>
