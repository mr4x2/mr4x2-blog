{{ define "main" }}
  <h1 class="sr-only">Page not found</h1>
  <div class="sec">
    <p class="cmd">
      $
      <b data-typed>cd <span data-missing-path>/missing-page</span></b
      ><span class="caret" aria-hidden="true"></span>
    </p>
    <p class="cmd typed-out reveal">
      bash: cd: <span data-missing-path>/missing-page</span>: No such file or
      directory
    </p>
    <p class="cmd typed-out reveal" style="--i: 1"><a href="/">cd ~</a></p>
  </div>
{{ end }}
