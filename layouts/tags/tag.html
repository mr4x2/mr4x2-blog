{{ define "main" }}
  <h1 class="sr-only">{{ .Title }}</h1>
  <div class="sec">
    <p class="cmd">
      $ <b>ls -t ~/posts --tag={{ .Data.Term | urlize }}</b>
    </p>
  </div>
  <ul class="posts">
    {{ range .Pages }}
      {{ partial "post-summary.html" (dict "post" .) }}
    {{ end }}
  </ul>
{{ end }}
