{{ define "main" }}
  <h1 class="sr-only">{{ .Title }}</h1>
  <div class="sec">
    <p class="cmd">$ <b>ls ~/{{ .Data.Plural }}</b></p>
    <ul class="tag-index">
      {{ range .Data.Terms.ByCount }}
        <li>
          <a href="{{ .Page.RelPermalink }}"
            >#{{ .Page.Data.Term | urlize }} ({{ .Count }})</a
          >
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
