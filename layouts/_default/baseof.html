<!doctype html>
<html
  lang="{{ site.Language.LanguageCode }}"
  dir="{{ or site.Language.LanguageDirection `ltr` }}"
  {{ if .IsHome }}
    data-intro
  {{ else if eq .Kind "404" }}
    data-intro="always"
  {{ end }}
>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}
    <main class="wrap">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
    {{ partial "search.html" . }}
  </body>
</html>
